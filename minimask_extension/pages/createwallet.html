<html>
<head>
	<title>MiniMask Extension</title>
	
	<!-- Load the CSS Style sheet -->
	<link rel="stylesheet" href="./style/style.css">
	
	<!-- Generic JS -->
	<script type="text/javascript" src="./js/generic.js"></script>
		
</head>
	
<body>
	
<center>
	<p class="eyebrow">Wallet setup</p>
	<h2>Restore Wallet</h2>
	<p class="intro-copy">Restore your wallet from a seed.</p>
	<label class="field-label" for="id_seed_txt">Please type in your seed</label>
	<input id="id_seed_txt" type="password">
	<p class="helper-copy">Don't forget to check your <b>key uses</b> in Settings.</p>
	<div class="button-row">
		<button class="mybtn secondary-action" id="id_btn_cancelwallet">Cancel</button>
		<button class="mybtn" id="id_btn_restorewallet">Proceed</button>
	</div>

	<div id="generate_wait" class="overlay-box">
			Generating.. pls wait..
	</div>
			
	<script src="./js/createwallet.js"></script>

</center>	

</body>

</html>
