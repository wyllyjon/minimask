<html>
<head>
	<title>MiniMask Extension</title>
	
	<!-- Load the CSS Style sheet -->
	<link rel="stylesheet" href="./style/styleinner.css">
	
	<!-- Generic JS -->
	<script type="text/javascript" src="./js/generic.js"></script>
		
</head>
	
<body>

<h3>Send</h3>
<center>
	
	<table style="width:100%;">
		<tr>
			<td class="righttd" nowrap>Token : </td>
			<td><select id="select_token"></select></td>
		</tr>
		
		<tr>
			<td class="righttd" nowrap>Amount : </td>
			<td><input id="send_amount" type="text"></td>
		</tr>
		
		<tr>
			<td class="righttd" nowrap>Address : </td>
			<td><input id="send_address" type="text"></td>
		</tr>
		
		<tr>
			<td class="righttd" nowrap>Key Uses : </td>
			<td><input id="send_keyuses" type="number"></td>
		</tr>
		
	</table>
	
	<div class="helper-copy">
		You can set key uses manually in <a href='./settings.html'>Settings</a><br>
		
	</div>
	
	<button class="mybtn" id="id_btn_send">Send Funds</button>
	
	  
	
	<div id="send_wait" class="overlay-box">
		Sending.. pls wait..
	</div>
		
	<script type="text/javascript" src="./js/send.js"></script>
	
</center>	

</body>

</html>
